name: Selfhost integration integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  accepted-patches:
    if: github.repository == 'plotome/multica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify accepted patches and complete isolation regression packages
        run: bash scripts/check-selfhost-integration.sh
