name: Air Desktop package

on:
  push:
    branches: [main]

permissions: {}

jobs:
  checked-commit:
    if: >-
      github.repository == 'plotome/multica' &&
      github.repository_id == '1337459851' &&
      github.event_name == 'push' && !github.event.deleted && !github.event.forced &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Require a merged pull request on the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg sha "$GITHUB_SHA" --argjson repo_id "$GITHUB_REPOSITORY_ID" '
              any(.[]; .merged_at != null and .merge_commit_sha == $sha and
                  .base.ref == "main" and .base.repo.id == $repo_id)
            ' > /dev/null
      - name: Require successful push checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The sibling workflows run in parallel and can finish in either order.
          # Query by workflow file, event, branch and full commit. Never use a PR
          # result or an earlier commit as evidence for this build.
          for workflow in ci.yml selfhost-integrity.yml; do
            while true; do
              run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f event=push -f "branch=$GITHUB_REF_NAME" -f "head_sha=$GITHUB_SHA" -F per_page=1)
              status=$(jq -r --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
                --argjson repo_id "$GITHUB_REPOSITORY_ID" '
                  .workflow_runs[0] |
                  if .head_sha == $sha and .head_branch == $branch and .event == "push"
                     and .head_repository.id == $repo_id and .repository.id == $repo_id
                     and .status == "completed" then .conclusion else "pending" end
                ' <<<"$run")
              case "$status" in
                success)
                  jq -r '.workflow_runs[0].html_url' <<<"$run" >> "$GITHUB_STEP_SUMMARY"
                  break
                  ;;
                pending) sleep 20 ;;
                *) echo "::error::$workflow concluded $status for $GITHUB_SHA"; exit 1 ;;
              esac
            done
          done

  package:
    needs: checked-commit
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      archive-digest: ${{ steps.pack.outputs.archive-digest }}
      manifest-digest: ${{ steps.pack.outputs.manifest-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream version tags
        # Forks do not inherit newly published tags. The Desktop packager and
        # CLI use the nearest version tag reachable from the pinned commit.
        run: |
          git fetch --no-tags --no-write-fetch-head https://github.com/multica-ai/multica.git \
            'refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build signed arm64 bundle and archive
        id: pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm install --frozen-lockfile
          pnpm --filter @multica/desktop package -- --mac --arm64 --dir --publish never -c.mac.identity=-
          stage="$RUNNER_TEMP/air-desktop"
          python3 scripts/pack-desktop-archive.py \
            --app apps/desktop/dist/mac-arm64/Multica.app --output "$stage" --commit "$GITHUB_SHA"
          echo "archive-digest=$(shasum -a 256 "$stage/Multica.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "manifest-digest=$(shasum -a 256 "$stage/manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          jq '{commit, version, arch, archive_bytes, archive_sha256}' "$stage/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multica-desktop-darwin-arm64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/air-desktop/Multica.tar.gz
            ${{ runner.temp }}/air-desktop/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  provenance:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Bind both downloaded files to the checked build
        env:
          ARCHIVE_DIGEST: ${{ needs.package.outputs.archive-digest }}
          MANIFEST_DIGEST: ${{ needs.package.outputs.manifest-digest }}
        run: |
          [[ "$ARCHIVE_DIGEST" =~ ^[a-f0-9]{64}$ && "$MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$ARCHIVE_DIGEST" Multica.tar.gz "$MANIFEST_DIGEST" manifest.json > "$RUNNER_TEMP/subjects.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256
          create-storage-record: false
